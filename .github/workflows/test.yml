# Builds, lints and runs the unit tests (against the in-memory fake router) on
# every push and pull request, and checks that the generated docs are current.
# Acceptance tests need a real router and are not run here.
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The unit tests run real terraform commands against the provider.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Unit tests
        run: go test -race -count=1 ./...

      - name: Check generated docs are up to date
        run: |
          go generate ./...
          git diff --exit-code -- docs/ || { echo "docs/ is out of date: run 'go generate ./...' and commit the result"; exit 1; }
